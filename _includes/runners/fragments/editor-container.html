<div class="editor-container">
  {% if include.top_controls %}
  <div class="control-panel">
    {{ include.top_controls }}
  </div>
  {% endif %}

  <textarea
    class="editor-textarea"
    aria-label="Editable starter code"
    rows="16"
    spellcheck="false"
  >{{ include.initial_code | escape }}</textarea>

  {% if include.bottom_controls %}
  <div class="control-panel">
    {{ include.bottom_controls }}
  </div>
  {% endif %}
</div>

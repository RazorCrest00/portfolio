  python: |
    def assemble_computer(parts, selected_parts):
        installed_count = 0
        step = 0

        for selected_part in selected_parts:
            expected_part = parts[step]
            if selected_part == expected_part:
                print(selected_part + " installed correctly.")
                installed_count += 1
                step += 1
            else:
                print(selected_part + " returned. Next part is " + expected_part + ".")

        return installed_count

    parts = ["CPU", "RAM", "M.2 SSD", "CPU cooler"]
    attempts = ["Graphics card", "CPU", "RAM", "M.2 SSD", "CPU cooler"]
    installed = assemble_computer(parts, attempts)
    print("Installed correctly:", installed, "of", len(parts))
  java: |
    public class Main {
        static int assembleComputer(String[] parts, String[] selectedParts) {
            int installedCount = 0;
            int step = 0;

            for (String selectedPart : selectedParts) {
                String expectedPart = parts[step];
                if (selectedPart.equals(expectedPart)) {
                    System.out.println(selectedPart + " installed correctly.");
                    installedCount++;
                    step++;
                } else {
                    System.out.println(selectedPart + " returned. Next part is " + expectedPart + ".");
                }
            }
            return installedCount;
        }

        public static void main(String[] args) {
            String[] parts = {"CPU", "RAM", "M.2 SSD", "CPU cooler"};
            String[] attempts = {"Graphics card", "CPU", "RAM", "M.2 SSD", "CPU cooler"};
            int installed = assembleComputer(parts, attempts);
            System.out.println("Installed correctly: " + installed + " of " + parts.length);
        }
    }


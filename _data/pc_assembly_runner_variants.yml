    def find_part(parts_tray, target_part):
        for position, part in enumerate(parts_tray, start=1):
            if part == target_part:
                return position
        return -1

    parts_tray = ["CPU", "RAM", "M.2 SSD", "Graphics card"]
    result = find_part(parts_tray, "Graphics card")
    print("Graphics card position:", result)
  java: |
    public class Main {
        static int findPart(String[] partsTray, String targetPart) {
            for (int index = 0; index < partsTray.length; index++) {
                if (partsTray[index].equals(targetPart)) {
                    return index + 1;
                }
            }
            return -1;
        }

        public static void main(String[] args) {
            String[] partsTray = {"CPU", "RAM", "M.2 SSD", "Graphics card"};
            int result = findPart(partsTray, "Graphics card");
            System.out.println("Graphics card position: " + result);
        }
    }


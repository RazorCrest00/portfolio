prototype:
  pseudocode: |
    parts ← ["CPU", "RAM", "M.2 SSD", "CPU cooler", "Motherboard", "Power supply", "Graphics card", "Power cables"]
    slots ← ["CPU socket", "RAM slots", "M.2 slot", "Cooler mount", "Board tray", "PSU bay", "PCIe slot", "Power headers"]
    sampleParts ← ["Graphics card", "CPU", "RAM", "M.2 SSD", "CPU cooler", "Motherboard", "Power supply", "Graphics card", "Power cables"]
    sampleSlots ← ["PCIe slot", "CPU socket", "RAM slots", "M.2 slot", "Cooler mount", "Board tray", "PSU bay", "PCIe slot", "Power headers"]
    currentStep ← 1
    attemptIndex ← 1
    correctAttempts ← 0

    REPEAT LENGTH(sampleParts) TIMES
    {
      selectedPart ← sampleParts[attemptIndex]
      selectedSlot ← sampleSlots[attemptIndex]

      IF (selectedPart = parts[currentStep] AND selectedSlot = slots[currentStep])
      {
        DISPLAY("Correct: " + selectedPart + " snapped into " + selectedSlot + ".")
        correctAttempts ← correctAttempts + 1
        currentStep ← currentStep + 1
      }
      ELSE
      {
        DISPLAY("Incorrect: " + selectedPart + " returned to the parts tray.")
      }

      attemptIndex ← attemptIndex + 1
    }

    DISPLAY("Build complete!")
    DISPLAY("Accuracy: " + correctAttempts + " of " + LENGTH(sampleParts))
  java: |
    import java.util.ArrayList;

    public class Main {
        static boolean checkPlacement(String part, String slot, int step, String[] parts, String[] slots) {
            return part.equalsIgnoreCase(parts[step]) && slot.equalsIgnoreCase(slots[step]);
        }

        public static void main(String[] args) {
            String[] parts = {"CPU", "RAM", "M.2 SSD", "CPU cooler", "Motherboard", "Power supply", "Graphics card", "Power cables"};
            String[] slots = {"CPU socket", "RAM slots", "M.2 slot", "Cooler mount", "Board tray", "PSU bay", "PCIe slot", "Power headers"};
            String[][] sampleAttempts = {
                {"Graphics card", "PCIe slot"}, {"CPU", "CPU socket"}, {"RAM", "RAM slots"},
                {"M.2 SSD", "M.2 slot"}, {"CPU cooler", "Cooler mount"}, {"Motherboard", "Board tray"},
                {"Power supply", "PSU bay"}, {"Graphics card", "PCIe slot"}, {"Power cables", "Power headers"}
            };
            ArrayList<Boolean> attempts = new ArrayList<>();
            int currentStep = 0;

            for (String[] attempt : sampleAttempts) {
                String selectedPart = attempt[0];
                String selectedSlot = attempt[1];
                boolean correct = checkPlacement(selectedPart, selectedSlot, currentStep, parts, slots);
                attempts.add(correct);

                if (correct) {
                    System.out.println("Correct: " + selectedPart + " snapped into " + selectedSlot + ".");
                    currentStep++;
                } else {
                    System.out.println("Incorrect: " + selectedPart + " returned to the parts tray.");
                }
            }

            int correctAttempts = 0;
            for (boolean correct : attempts) {
                if (correct) correctAttempts++;
            }
            System.out.println("Build complete!");
            System.out.println("Accuracy: " + correctAttempts + " of " + attempts.size());
        }
    }
